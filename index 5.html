      { style: { fontFamily: "'Public Sans', sans-serif", textAlign: "center", marginTop: "120px", padding: "0 20px" } },
      React.createElement(
        "h1",
        { style: { fontFamily: "Georgia, serif", fontStyle: "italic", fontWeight: 500, fontSize: 36, color: INK, margin: 0 } },
        "Verbatim"
      ),
      React.createElement(
        "p",
        { style: { color: INK_SOFT, fontSize: 14, margin: "10px 0 26px" } },
        "Log in or create an account to start keeping your words."
      ),
      React.createElement(
        "button",
        {
          onClick: function () { window.netlifyIdentity.open("login"); },
          style: { background: TEAL, color: "#fff", border: "none", borderRadius: 8, padding: "10px 22px", fontSize: 14, fontWeight: 600, cursor: "pointer", marginRight: 10 },
        },
        "Log in"
      ),
      React.createElement(
        "button",
        {
          onClick: function () { window.netlifyIdentity.open("signup"); },
          style: { background: "#fff", color: TEAL, border: "1px solid " + TEAL, borderRadius: 8, padding: "10px 22px", fontSize: 14, fontWeight: 600, cursor: "pointer" },
        },
        "Sign up"
      )
    )
  );
}

function renderChecking() {
  root.render(
    React.createElement(
      "p",
      { style: { fontFamily: "'Public Sans', sans-serif", textAlign: "center", marginTop: "140px", color: INK_SOFT } },
      "Just a moment…"
    )
  );
}

function renderSubscribe() {
  root.render(
    React.createElement(
      "div",
      { style: { fontFamily: "'Public Sans', sans-serif", textAlign: "center", marginTop: "60px", padding: "0 20px", maxWidth: 420, marginLeft: "auto", marginRight: "auto" } },
      React.createElement(
        "h1",
        { style: { fontFamily: "Georgia, serif", fontStyle: "italic", fontWeight: 500, fontSize: 32, color: INK, margin: 0 } },
        "Verbatim"
      ),
      React.createElement(
        "p",
        { style: { color: INK_SOFT, fontSize: 14, margin: "10px 0 30px" } },
        "You're logged in — subscribe to start keeping your words."
      ),
      React.createElement(
        "div",
        { style: { background: "#fff", border: "1px solid #D9D3C3", borderRadius: 10, padding: 20, marginBottom: 18 } },
        React.createElement("p", { style: { fontWeight: 600, color: INK, margin: "0 0 4px" } }, "Monthly — $4.99/mo"),
        React.createElement("div", { id: "paypal-button-container-monthly" })
      ),
      React.createElement(
        "div",
        { style: { background: "#fff", border: "1px solid #D9D3C3", borderRadius: 10, padding: 20 } },
        React.createElement("p", { style: { fontWeight: 600, color: INK, margin: "0 0 4px" } }, "Yearly — $29.99/yr"),
        React.createElement("p", { style: { fontSize: 12, color: TEAL, margin: "0 0 10px" } }, "Best value — about $2.50/mo"),
        React.createElement("div", { id: "paypal-button-container-yearly" })
      ),
      React.createElement(
        "button",
        {
          onClick: function () { window.netlifyIdentity.logout(); },
          style: { background: "none", border: "none", color: INK_SOFT, fontSize: 12.5, marginTop: 20, cursor: "pointer", textDecoration: "underline" },
        },
        "Log out"
      )
    )
  );

  setTimeout(function () {
    if (!window.paypal) return;

    async function activate(subscriptionID) {
      try {
        var token = await getIdentityToken();
        var res = await fetch("/.netlify/functions/activate-subscription", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ subscriptionId: subscriptionID }),
        });
        if (res.ok) {
          renderApp();
        } else {
          alert("We couldn't confirm that subscription just yet. If you were charged, please contact support and we'll sort it out.");
        }
      } catch (e) {
        alert("Something went wrong confirming your subscription. Please reload and check My words, or contact support.");
      }
    }

    window.paypal.Buttons({
      style: { shape: "rect", color: "gold", layout: "vertical", label: "subscribe" },
      createSubscription: function (data, actions) {
        return actions.subscription.create({ plan_id: "P-7H78015375966184ANKLGGYY" });
      },
      onApprove: function (data) { activate(data.subscriptionID); },
    }).render("#paypal-button-container-monthly");

    window.paypal.Buttons({
      style: { shape: "rect", color: "gold", layout: "vertical", label: "subscribe" },
      createSubscription: function (data, actions) {
        return actions.subscription.create({ plan_id: "P-9RW93862BR088871MNKLGERQ" });
      },
      onApprove: function (data) { activate(data.subscriptionID); },
    }).render("#paypal-button-container-yearly");
  }, 300);
}

async function renderApp() {
  root.render(React.createElement(App));
}

async function checkAndRender() {
  renderChecking();
  try {
    var token = await getIdentityToken();
    var res = await fetch("/.netlify/functions/check-subscription", {
      headers: { Authorization: "Bearer " + token },
    });
    var data = await res.json();
    if (data.subscribed) {
      renderApp();
    } else {
      renderSubscribe();
    }
  } catch (e) {
    renderSubscribe();
  }
}

window.netlifyIdentity.on("init", function (user) {
  user ? checkAndRender() : renderLogin();
});
window.netlifyIdentity.on("login", function () {
  window.netlifyIdentity.close();
  checkAndRender();
});
window.netlifyIdentity.on("logout", function () {
  renderLogin();
});
window.netlifyIdentity.init();
</script>
</body>
</html>
